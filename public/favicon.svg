<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
    <linearGradient id="crown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Crown -->
  <g transform="translate(256,240)" fill="url(#crown)">
    <!-- Base -->
    <rect x="-110" y="40" width="220" height="30" rx="8"/>
    <!-- Crown body -->
    <polygon points="-120,40 -100,-20 -60,20 -20,-60 0,-20 20,-60 60,20 100,-20 120,40"/>
    <!-- Crown jewels -->
    <circle cx="-100" cy="-10" r="10" fill="#dc2626"/>
    <circle cx="0" cy="-50" r="12" fill="#dc2626"/>
    <circle cx="100" cy="-10" r="10" fill="#dc2626"/>
    <!-- Sparkles -->
    <circle cx="-60" cy="5" r="6" fill="#fef08a" opacity="0.7"/>
    <circle cx="60" cy="5" r="6" fill="#fef08a" opacity="0.7"/>
  </g>
</svg>